name: Publish MyST book

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

env:
  # Base URL the site is served from, including CSS & JS assets
  # (GitHub project pages live at /<repo-name>/).
  BASE_URL: /${{ github.event.repository.name }}

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-docs:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          # tvb-library compiles _cpp_hybrid with -march=native; caching wheels
          # across heterogeneous x86-64 runners causes SIGILL on older CPUs.
          enable-cache: false

      - name: Install pinned dependencies
        run: python make.py setup

      - name: Check references against Crossref
        env:
          CROSSREF_MAILTO: ${{ secrets.CROSSREF_MAILTO }}
        run: python make.py refs

      - name: Cache MyST executed notebooks
        uses: actions/cache@v4
        with:
          path: _build/execute
          key: myst-execute-${{ runner.os }}-${{ hashFiles('requirements/uv.lock', 'content/_code/**', 'trajecturtle/src/**') }}-${{ hashFiles('content/**') }}
          restore-keys: |
            myst-execute-${{ runner.os }}-${{ hashFiles('requirements/uv.lock', 'content/_code/**', 'trajecturtle/src/**') }}-

      - name: Build MyST HTML, check glossary, and stage notebooks
        run: python make.py docs

      - name: Upload docs artifact
        uses: actions/upload-artifact@v4
        with:
          name: docs-html
          path: _build/html
          include-hidden-files: true
          retention-days: 1

  build-lite:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Extract TVB git revision from environment.yml
        id: tvb_rev
        run: |
          python3 - <<'PY' >> "$GITHUB_OUTPUT"
          import re
          from pathlib import Path

          text = Path("environment.yml").read_text(encoding="utf-8")
          m = re.search(r"tvb-library\s*@\s*git\+(https://[^\s@\"]+)@([^\s#\"]+)", text)
          if m:
              print(f"url={m.group(1)}")
              print(f"rev={m.group(2)}")
          PY

      - name: Cache built JupyterLite site
        id: cache-lite
        uses: actions/cache@v4
        with:
          path: |
            _build/lite
            _build/lite_contents
            _build/.state.json
            .jupyterlite.doit.db
          key: lite-site-${{ runner.os }}-${{ hashFiles('build-environment.yml', 'environment.yml', 'wasm-tests/recipes/**', 'mcp-hub-extension/**', 'extensions/**', 'jupyter_lite_config.json', 'jupyter-lite.json', 'overrides.json', 'cockle-config.json', 'tools/build_xeus_prefix.py') }}-${{ hashFiles('content/**', 'README.md', 'tools/stage_lite.py', 'tools/patch_lite_runtime.py', 'make.py') }}
          restore-keys: |
            lite-site-${{ runner.os }}-${{ hashFiles('build-environment.yml', 'environment.yml', 'wasm-tests/recipes/**', 'mcp-hub-extension/**', 'extensions/**', 'jupyter_lite_config.json', 'jupyter-lite.json', 'overrides.json', 'cockle-config.json', 'tools/build_xeus_prefix.py') }}-

      - name: Install mamba
        if: steps.cache-lite.outputs.cache-hit != 'true'
        uses: mamba-org/setup-micromamba@v2
        with:
          micromamba-version: '1.5.8-0'
          environment-file: build-environment.yml
          cache-environment: true

      - name: Cache WASM packages (local-channel)
        id: cache-wasm
        if: steps.cache-lite.outputs.cache-hit != 'true'
        uses: actions/cache@v4
        with:
          path: local-channel
          key: wasm-pkgs-${{ runner.os }}-${{ hashFiles('wasm-tests/recipes/**') }}-${{ steps.tvb_rev.outputs.rev }}

      - name: Build the tvb-gdist wasm package
        if: steps.cache-lite.outputs.cache-hit != 'true' && steps.cache-wasm.outputs.cache-hit != 'true'
        shell: bash -l {0}
        run: |
          mkdir -p "$GITHUB_WORKSPACE/local-channel"
          rattler-build build \
            --recipe wasm-tests/recipes/tvb-gdist \
            --target-platform emscripten-wasm32 \
            --test skip \
            --output-dir "$GITHUB_WORKSPACE/local-channel" \
            -c https://repo.prefix.dev/emscripten-forge-4x \
            -c https://repo.prefix.dev/emscripten-forge-dev \
            -c https://repo.prefix.dev/conda-forge \
            -c microsoft \
            -m wasm-tests/recipes/variant.yaml

      - name: Build the tvb-cpp-hybrid wasm package
        if: steps.cache-lite.outputs.cache-hit != 'true' && steps.cache-wasm.outputs.cache-hit != 'true'
        shell: bash -l {0}
        env:
          TVB_ROOT_GIT_URL: ${{ steps.tvb_rev.outputs.url }}
          TVB_ROOT_GIT_REV: ${{ steps.tvb_rev.outputs.rev }}
        run: |
          mkdir -p "$GITHUB_WORKSPACE/local-channel"
          rattler-build build \
            --recipe wasm-tests/recipes/tvb-cpp-hybrid \
            --target-platform emscripten-wasm32 \
            --test skip \
            --output-dir "$GITHUB_WORKSPACE/local-channel" \
            -c https://repo.prefix.dev/emscripten-forge-4x \
            -c https://repo.prefix.dev/emscripten-forge-dev \
            -c https://repo.prefix.dev/conda-forge \
            -c microsoft \
            -m wasm-tests/recipes/variant.yaml

      - name: Add tvb-gdist and tvb-cpp-hybrid to the kernel environment
        if: steps.cache-lite.outputs.cache-hit != 'true'
        shell: bash -l {0}
        run: |
          python - <<'PY'
          from pathlib import Path

          root = Path.cwd()
          lines = Path("environment.yml").read_text().splitlines()
          out = []
          for line in lines:
              out.append(line)
              if line.strip() == "channels:":
                  out.append(f"  - file://{root}/local-channel")
          lines, out = out, []
          for line in lines:
              out.append(line)
              if line.strip() == "dependencies:":
                  out.append("  - tvb-gdist")
                  out.append("  - tvb-cpp-hybrid")
          Path("environment.ci.yml").write_text("\n".join(out) + "\n")
          PY

      - name: Cache MCP hub JupyterLite extension
        id: cache-mcp-ext
        if: steps.cache-lite.outputs.cache-hit != 'true'
        uses: actions/cache@v4
        with:
          path: |
            mcp-hub-extension/node_modules
            extensions/@tvbl/jupyterlite-mcp-hub
          key: mcp-hub-ext-${{ runner.os }}-${{ hashFiles('mcp-hub-extension/**') }}

      - name: Setup Node for MCP hub extension
        if: steps.cache-lite.outputs.cache-hit != 'true' && steps.cache-mcp-ext.outputs.cache-hit != 'true'
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Build the MCP hub JupyterLite extension
        if: steps.cache-lite.outputs.cache-hit != 'true' && steps.cache-mcp-ext.outputs.cache-hit != 'true'
        shell: bash -l {0}
        run: |
          cd mcp-hub-extension
          jlpm install --immutable
          jlpm build
          ls -R ../extensions/@tvbl/jupyterlite-mcp-hub | head -20

      - name: Cache xeus WASM prefix
        if: steps.cache-lite.outputs.cache-hit != 'true'
        uses: actions/cache@v4
        with:
          path: _build/xeus-prefix
          key: xeus-prefix-${{ runner.os }}-${{ hashFiles('environment.yml', 'wasm-tests/recipes/**', 'tools/build_xeus_prefix.py') }}

      - name: Build the JupyterLite site and apply runtime patches
        if: steps.cache-lite.outputs.cache-hit != 'true'
        shell: bash -l {0}
        env:
          CMAKE_ARGS: -DTVB_CPP_BUILD_EXTENSION=OFF
        run: python make.py lite

      - name: Upload JupyterLite artifact
        uses: actions/upload-artifact@v4
        with:
          name: lite-site
          path: _build/lite
          include-hidden-files: true
          retention-days: 1

  assemble:
    needs: [build-docs, build-lite]
    runs-on: ubuntu-latest
    steps:
      - name: Download docs HTML artifact
        uses: actions/download-artifact@v4
        with:
          name: docs-html
          path: _build/html

      - name: Verify docs artifact does not contain stale lite output
        run: test ! -e _build/html/lite

      - name: Download JupyterLite artifact
        uses: actions/download-artifact@v4
        with:
          name: lite-site
          path: _build/html/lite

      - name: Finalize static site tree
        run: |
          touch _build/html/.nojekyll
          test -f _build/html/index.html
          test -f _build/html/site-search-manifest.json
          test -d _build/html/notebooks
          test -f _build/html/lite/lab/index.html
          test -f _build/html/lite/xeus/kernels.json

      - name: Upload static site preview artifact
        if: github.event_name == 'pull_request' || github.ref != 'refs/heads/main'
        uses: actions/upload-artifact@v4
        with:
          name: static-site
          path: _build/html
          include-hidden-files: true
          retention-days: 5

      - name: Setup Pages
        if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
        uses: actions/configure-pages@v5

      - name: Upload Pages artifact
        if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
        uses: actions/upload-pages-artifact@v3
        with:
          path: _build/html

  deploy:
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    needs: assemble
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
