name: Publish MyST book

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

env:
  # Base URL the site is served from, including CSS & JS assets
  # (GitHub project pages live at /<repo-name>/).
  BASE_URL: /${{ github.event.repository.name }}

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install uv
        uses: astral-sh/setup-uv@v5

      - name: Install pinned dependencies
        run: python make.py setup

      - name: Check references against Crossref
        env:
          CROSSREF_MAILTO: ${{ secrets.CROSSREF_MAILTO }}
        run: python make.py refs

      - name: Build MyST HTML, check glossary, and stage JupyterLite contents
        run: python make.py docs

      - name: Install mamba
        if: github.event_name != 'pull_request'
        uses: mamba-org/setup-micromamba@v1
        with:
          micromamba-version: '1.5.8-0'
          environment-file: build-environment.yml
          cache-environment: true

      - name: Build the tvb-gdist wasm package
        if: github.event_name != 'pull_request'
        shell: bash -l {0}
        run: |
          mkdir -p "$GITHUB_WORKSPACE/local-channel"
          rattler-build build \
            --recipe wasm-tests/recipes/tvb-gdist \
            --target-platform emscripten-wasm32 \
            --test skip \
            --output-dir "$GITHUB_WORKSPACE/local-channel" \
            -c https://repo.prefix.dev/emscripten-forge-4x \
            -c https://repo.prefix.dev/emscripten-forge-dev \
            -c https://repo.prefix.dev/conda-forge \
            -c microsoft \
            -m wasm-tests/recipes/variant.yaml

      - name: Build the tvb-cpp-hybrid wasm package
        if: github.event_name != 'pull_request'
        shell: bash -l {0}
        run: |
          mkdir -p "$GITHUB_WORKSPACE/local-channel"
          eval "$(python - <<'PY'
          import re
          import shlex
          from pathlib import Path

          text = Path("environment.yml").read_text()
          m = re.search(r"tvb-library\s*@\s*git\+(https://[^\s@\"]+)@([^\s#\"]+)", text)
          if m:
              print(f"export TVB_ROOT_GIT_URL={shlex.quote(m.group(1))}")
              print(f"export TVB_ROOT_GIT_REV={shlex.quote(m.group(2))}")
          PY
          )"
          rattler-build build \
            --recipe wasm-tests/recipes/tvb-cpp-hybrid \
            --target-platform emscripten-wasm32 \
            --test skip \
            --output-dir "$GITHUB_WORKSPACE/local-channel" \
            -c https://repo.prefix.dev/emscripten-forge-4x \
            -c https://repo.prefix.dev/emscripten-forge-dev \
            -c https://repo.prefix.dev/conda-forge \
            -c microsoft \
            -m wasm-tests/recipes/variant.yaml

      - name: Add tvb-gdist and tvb-cpp-hybrid to the kernel environment
        if: github.event_name != 'pull_request'
        shell: bash -l {0}
        run: |
          python - <<'PY'
          from pathlib import Path

          root = Path.cwd()
          lines = Path("environment.yml").read_text().splitlines()
          out = []
          for line in lines:
              out.append(line)
              if line.strip() == "channels:":
                  out.append(f"  - file://{root}/local-channel")
          lines, out = out, []
          for line in lines:
              out.append(line)
              if line.strip() == "dependencies:":
                  out.append("  - tvb-gdist")
                  out.append("  - tvb-cpp-hybrid")
          Path("environment.ci.yml").write_text("\n".join(out) + "\n")
          PY

      - name: Build the MCP hub JupyterLite extension
        if: github.event_name != 'pull_request'
        shell: bash -l {0}
        run: |
          cd mcp-hub-extension
          jlpm install --immutable
          jlpm build
          ls -R ../extensions/@tvbl/jupyterlite-mcp-hub | head -20

      - name: Build the JupyterLite site and apply runtime patches
        if: github.event_name != 'pull_request'
        shell: bash -l {0}
        env:
          CMAKE_ARGS: -DTVB_CPP_BUILD_EXTENSION=OFF
        run: python make.py lite

      - name: Setup Pages
        if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
        uses: actions/configure-pages@v5

      - name: Upload Pages artifact
        if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
        uses: actions/upload-pages-artifact@v3
        with:
          path: _build/html

  deploy:
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
