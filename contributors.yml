# Contributor profile metadata for per-page attribution and the Contributors page.
#
# How to add or update your profile:
#   1. Find your entry below (or add a new key using a lowercase slug of your name).
#   2. Set `github` to your GitHub username (without `@`).
#   3. Optionally set `affiliation` (e.g. university, lab, or institute name) and
#      `website` (full `https://...` URL to your institute, lab, or personal page).
#   4. If you committed under multiple emails, add a mapping in `.mailmap` or list
#      extra emails under `emails:`.
#
# Example entry with optional affiliation and website:
#   jane-doe:
#     name: Jane Doe
#     email: jane.doe@example.org
#     github: janedoe
#     affiliation: Institute for Systems Neuroscience
#     website: https://ins-amu.fr

